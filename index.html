<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SL Radio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SL Radio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1020;--card:#1a2238;--card2:#232f4b;--accent:#f59e0b;--accent2:#8b5cf6;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;--success:#10b981}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Sinhala",sans-serif;background:linear-gradient(160deg,#0b1020,#1e1b4b) fixed;color:var(--text);min-height:100vh;padding-bottom:170px;overflow-x:hidden}
header{padding:calc(env(safe-area-inset-top) + 16px) 20px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;font-weight:700;line-height:1.1}
.ttl{display:flex;flex-direction:column;min-width:0}
.clock{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.clock b{color:var(--accent);font-weight:700;font-size:13px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px}
.search-wrap{padding:12px 20px;display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;width:100%;padding:12px 16px;border-radius:14px;border:none;background:var(--card);color:var(--text);font-size:15px;outline:none}
.search::placeholder{color:var(--muted)}
.sbtn{flex-shrink:0;height:44px;min-width:44px;padding:0 12px;border-radius:14px;border:none;background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:8px;padding:0 20px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--muted);border:none;font-size:13px;cursor:pointer}
.tab.active{background:var(--accent);color:#000;font-weight:600}
.list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.station{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);cursor:pointer;border:2px solid transparent;transition:.2s}
.station:active{transform:scale(.98)}
.station.playing{border-color:var(--accent);background:var(--card2)}
.icon{width:48px;height:48px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#334155,#1e293b);display:grid;place-items:center;font-size:22px}
.station.playing .icon{background:linear-gradient(135deg,var(--accent),var(--accent2));animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.meta .warn{color:var(--accent)}
.star,.menu{font-size:18px;padding:6px;background:none;border:none;color:var(--muted);cursor:pointer}
.star.on{color:var(--accent)}
.player{position:fixed;left:0;right:0;bottom:0;background:rgba(26,34,56,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);transform:translateY(100%);transition:transform .3s;z-index:50}
.player.show{transform:translateY(0)}
.row1{display:flex;align-items:center;gap:12px}
.icon-big{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:20px;flex-shrink:0}
.btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#000;font-size:18px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.btn.small{width:36px;height:36px;background:var(--card2);color:var(--text);font-size:16px}
.row2{display:flex;align-items:center;gap:10px;margin-top:10px}
.timer-btn{flex:1;padding:8px;border-radius:10px;border:none;background:var(--card2);color:var(--text);font-size:13px;cursor:pointer}
.timer-btn.active{background:var(--accent);color:#000;font-weight:600}
.vol{width:70px;accent-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 160px);width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(245,158,11,.4);z-index:40}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-content{width:100%;max-width:500px;background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:17px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--card2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 20px);left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card2);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.6}
.hbtn{margin-left:auto;padding:8px 14px;border-radius:20px;border:none;background:var(--card);color:var(--text);font-size:13px;cursor:pointer}
#omodal{z-index:45}
#omodal .modal-content{max-height:88vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 140px)}
.srow{display:flex;gap:8px;margin-bottom:10px}
.srow .search{flex:1;min-width:0}
.srow button{padding:0 16px;border-radius:14px;border:none;background:var(--accent);color:#000;font-weight:600;font-size:14px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0 12px}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.orow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--bg);margin-bottom:8px;border:2px solid transparent}
.orow.playing{border-color:var(--accent)}
.obtn{padding:8px 12px;border-radius:10px;border:none;background:var(--card2);color:var(--text);font-size:14px;cursor:pointer;flex-shrink:0}
.obtn.add{background:var(--accent);color:#000;font-weight:600}
.obtn.done{opacity:.5}
.ohint{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.dsum{display:flex;gap:8px;margin-bottom:14px}
.dbox{flex:1;background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.dbox b{display:block;font-size:16px}
.dbox span{font-size:11px;color:var(--muted)}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.dl{width:48px;color:var(--muted);flex-shrink:0}
.dbar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.dv{width:64px;text-align:right;flex-shrink:0}
#dmodal .ohint{margin-top:12px}
</style>
</head>
<body>
<header><div class="logo">📻</div><div class="ttl"><h1>SL Radio</h1><div class="clock" id="clock"></div></div><button class="hbtn" id="onlineBtn" data-i18n="onlineBtn">🌐 සොයන්න</button></header>
<div class="search-wrap">
  <input class="search" id="search" data-i18n-ph="searchPh" placeholder="🔍 නාලිකා සොයන්න">
  <button class="sbtn" id="dataBtn" aria-label="Data usage">📊</button>
  <button class="sbtn" id="langBtn" aria-label="Language">EN</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<button class="fab" id="fab" aria-label="Add station">＋</button>

<div class="player" id="player">
  <div class="row1">
    <div class="icon-big" id="pIcon">📻</div>
    <div class="info"><div class="name" id="pName">—</div><div class="meta" id="pStatus">නවත්වා ඇත</div></div>
    <button class="btn small" id="pStar">☆</button>
    <button class="btn" id="pPlay">▶</button>
  </div>
  <div class="row2">
    <button class="timer-btn" id="timerBtn">⏰ Sleep: Off</button>
    <button class="btn small" id="pClose">✕</button>
    <input type="range" class="vol" id="vol" min="0" max="100" value="80">
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">නාලිකාවක් එකතු කරන්න</h3>
    <div class="field"><label data-i18n="lName">නම</label><input id="fName" placeholder="Hiru FM"></div>
    <div class="field"><label data-i18n="lFreq">සංඛ්‍යාතය (optional)</label><input id="fFreq" placeholder="96.1"></div>
    <div class="field"><label data-i18n="lUrl">Stream URL</label><input id="fUrl" placeholder="https://..."></div>
    <div class="field"><label data-i18n="lGenre">භාෂාව</label>
      <select id="fGenre">
        <option value="Sinhala" data-i18n="oSi">සිංහල</option>
        <option value="Tamil" data-i18n="oTa">தமிழ்</option>
        <option value="English" data-i18n="oEn">English</option>
        <option value="Mixed" data-i18n="oMx">මිශ්‍ර</option>
      </select>
    </div>
    <div class="field"><label data-i18n="lBitrate">Bitrate kbps (optional)</label><input id="fBitrate" type="number" inputmode="numeric" min="0" max="512" placeholder="64"></div>
    <div class="field"><label data-i18n="lEmoji">Emoji (optional)</label><input id="fEmoji" placeholder="📻" maxlength="2"></div>
    <div class="actions">
      <button class="btn-secondary" id="cancelBtn" data-i18n="cancel">අවලංගු</button>
      <button class="btn-danger" id="deleteBtn" data-i18n="del" style="display:none">මකන්න</button>
      <button class="btn-primary" id="saveBtn" data-i18n="save">සුරකින්න</button>
    </div>
  </div>
</div>

<div class="modal" id="omodal">
  <div class="modal-content">
    <h3 data-i18n="oTitle">🌐 Online නාලිකා සොයන්න</h3>
    <div class="srow">
      <input class="search" id="oQuery" data-i18n-ph="oPh" placeholder="නම (හිස්ව තැබිය හැක)">
      <button id="oGo" data-i18n="oGo">සොයන්න</button>
    </div>
    <label class="sw"><input type="checkbox" id="oLow"> <span data-i18n="oLow">📉 අඩු data (≤ 64 kbps පමණක්)</span></label>
    <div class="ohint" data-i18n="oHint">HTTPS streams පමණක්. ▶ එබුවාම ඇහෙනවා, ＋ එබුවාම list එකට එකතු වෙනවා.</div>
    <div id="oList"><div class="empty" data-i18n="oInit">"සොයන්න" එබුවාම ලංකාවේ stations පෙන්වයි</div></div>
    <div class="actions"><button class="btn-secondary" id="oClose" data-i18n="close">වසන්න</button></div>
  </div>
</div>

<div class="modal" id="dmodal">
  <div class="modal-content">
    <h3 data-i18n="dTitle">📊 Data භාවිතය</h3>
    <div class="dsum" id="dSum"></div>
    <div id="dBars"></div>
    <div class="ohint" data-i18n="dNote">ආසන්න අගයක් පමණයි.</div>
    <div class="actions">
      <button class="btn-danger" id="dReset" data-i18n="dReset">මකන්න</button>
      <button class="btn-secondary" id="dClose" data-i18n="close">වසන්න</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const K_ST = 'slradio_st_v2', K_FAV = 'slradio_fav_v1', K_VER = 'slradio_ver';

const DATA_VER = 2;

    tabAll:'🌐 සියල්ල', tabSi:'සිංහල', tabTa:'தமிழ்', tabEn:'English', tabMx:'මිශ්‍ර', tabFav:'⭐ ප්‍රියතම',

function load(k, d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}}
function save(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch{}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let lang = load(K_LANG, 'si');
if(!I18N[lang]) lang = 'si';
function t(k, ...a){
  let s = (I18N[lang][k] != null ? I18N[lang][k] : (I18N.si[k] != null ? I18N.si[k] : k));
  a.forEach((v,i)=>{ s = s.split('{'+i+'}').join(v) });
  return s;
}

let favs = load(K_FAV, ['hiru']);
let current = null, playing = false, baseVolume = 0.8;

// reconnect state
const RETRY_DELAYS = [2000, 4000, 8000, 15000, 30000];
let retryN = 0, retryTO = null, waitTO = null, userPaused = false, switching = false;

// data usage state
let segStart = null, segBps = 16000;

const audio = $('audio');

function isMixed(url){return location.protocol==='https:' && /^http:\/\//i.test(url)}
function toast(msg, ms=3000){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms)}

// ===== Data usage counter =====
function dayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addData(bytes){
  if(!(bytes>0)) return;
  const d = load(K_DATA, {}), k = dayKey();
  d[k] = (d[k]||0) + bytes;
  const keys = Object.keys(d).sort();
  while(keys.length>40) delete d[keys.shift()];
  save(K_DATA, d);
}
function flushData(end){
  if(segStart==null) return;
  const now = Date.now();
  const sec = Math.min((now-segStart)/1000, 300);
  addData(sec*segBps);
  segStart = end ? null : now;
}
function fmtBytes(b){
  if(b < 1048576) return Math.max(0,Math.round(b/1024))+' KB';
  if(b < 1073741824) return (b/1048576).toFixed(b<10485760?1:0)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
function renderData(){
  const d = load(K_DATA, {});
  const now = new Date(), today = dayKey(now);
  const days = [];
  for(let i=6;i>=0;i--){const x=new Date(now);x.setDate(x.getDate()-i);days.push(dayKey(x))}
  const vals = days.map(k=>d[k]||0);
  const max = Math.max(...vals, 1);
  const week = vals.reduce((a,b)=>a+b,0);
  const ym = today.slice(0,7);
  const month = Object.keys(d).filter(k=>k.startsWith(ym)).reduce((a,k)=>a+d[k],0);
  $('dSum').innerHTML =
    `<div class="dbox"><b>${fmtBytes(d[today]||0)}</b><span>${t('dToday')}</span></div>`+
    `<div class="dbox"><b>${fmtBytes(week)}</b><span>${t('dWeek')}</span></div>`+
    `<div class="dbox"><b>${fmtBytes(month)}</b><span>${t('dMonth')}</span></div>`;
  $('dBars').innerHTML = days.map((k,i)=>
    `<div class="drow"><span class="dl">${k===today?t('dToday'):k.slice(5)}</span><div class="dbar"><i style="width:${Math.round(vals[i]/max*100)}%"></i></div><span class="dv">${fmtBytes(vals[i])}</span></div>`
  ).join('');
}

// ===== Auto-reconnect =====
function clearRetry(){ clearTimeout(retryTO); retryTO = null }
function clearWait(){ clearTimeout(waitTO); waitTO = null }

function scheduleRetry(){
  if(!current || userPaused || isMixed(current.url)) return;
  if(retryTO) return;
  if(retryN >= RETRY_DELAYS.length){
    retryN = 0;
    $('pStatus').textContent = t('cantConnect');
    toast(t('giveUp'), 4000);
    return;
  }
  const delay = RETRY_DELAYS[retryN++];
  $('pStatus').textContent = t('retrying', retryN, RETRY_DELAYS.length);
  retryTO = setTimeout(()=>{
    retryTO = null;
    if(!current || userPaused) return;
    audio.src = current.url;
    audio.load();
    audio.play().catch(onPlayReject);
  }, delay);
}

function onPlayReject(err){
  console.warn(err);
  if(err && err.name==='AbortError') return;      // අලුත් load එකකින් නතර වුණා
  playing = false; updateUI();
  if(err && err.name==='NotAllowedError'){
    $('pStatus').textContent = t('stopped');
    toast(t('playFail'));
    return;
  }
  if(current && isMixed(current.url)){
    $('pStatus').textContent = t('errorSt');
    toast(t('httpFail'));
    return;
  }
  if(retryN===0) toast(t('openFail'));
  scheduleRetry();
}

// ===== UI render =====
function renderTabs(){
  const genres = ['all','Sinhala','Tamil','English','Mixed','fav'];
  const keys = {all:'tabAll',Sinhala:'tabSi',Tamil:'tabTa',English:'tabEn',Mixed:'tabMx',fav:'tabFav'};
  $('tabs').innerHTML = genres.map(g=>`<button class="tab ${filter===g?'active':''}" data-g="${g}">${t(keys[g])}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.g;renderTabs();renderList()});
}

function filtered(){
  return stations.filter(s=>{
    if(filter==='fav' && !favs.includes(s.id)) return false;
    if(filter!=='all' && filter!=='fav' && s.genre!==filter) return false;
    if(query){const q=query.toLowerCase();if(!s.name.toLowerCase().includes(q)&&!(s.freq||'').includes(q))return false}
    return true;
  });
}

function renderList(){
  const list = filtered();
  if(!list.length){$('list').innerHTML=`<div class="empty">${t('emptyList')}</div>`;return}
  $('list').innerHTML = list.map(s=>`
    <div class="station ${current&&current.id===s.id?'playing':''}" data-id="${esc(s.id)}">
      <div class="icon">${esc(s.emoji||'📻')}</div>
      <div class="info"><div class="name">${esc(s.name)}</div><div class="meta">${s.freq?esc(s.freq)+' FM · ':''}${esc(s.genre||'')}${s.bitrate?' · '+esc(s.bitrate)+'k':''}${isMixed(s.url)?' · <span class="warn">⚠ HTTP</span>':''}</div></div>
      <button class="star ${favs.includes(s.id)?'on':''}" data-fav="${esc(s.id)}" aria-label="Favorite">${favs.includes(s.id)?'★':'☆'}</button>
      <button class="menu" data-edit="${esc(s.id)}" aria-label="Edit">✎</button>
    </div>`).join('');
  $('list').querySelectorAll('.station').forEach(el=>{
    el.onclick = e=>{
      if(e.target.closest('[data-fav]')||e.target.closest('[data-edit]')) return;
      playStation(stations.find(x=>x.id===el.dataset.id));
    };
  });
  $('list').querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav)});
  $('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(b.dataset.edit)});
}

function toggleFav(id){
  if(id==='tmp_preview'){toast(t('favFirst'));return}
  if(favs.includes(id)) favs = favs.filter(x=>x!==id); else favs.push(id);
  save(K_FAV, favs); renderList();
  if(current && current.id===id) $('pStar').textContent = favs.includes(id)?'★':'☆';
}

function playStation(s){
  if(!s) return;
  if(!s.url){toast(t('noUrl'));return}
  if(isMixed(s.url)) toast(t('httpWarn'),4000);
  flushData(true);
  clearRetry(); clearWait(); retryN = 0; userPaused = false;
  if(fadeIV){clearInterval(fadeIV);fadeIV=null}
  switching = true; setTimeout(()=>{switching=false}, 400);
  current = s;
  audio.pause();
  audio.src = s.url;
  audio.volume = baseVolume;
  $('pStatus').textContent = t('connecting');
  audio.play().catch(onPlayReject);
  $('player').classList.add('show');
  $('pName').textContent = s.name;
  $('pIcon').textContent = s.emoji || '📻';
  $('pStar').textContent = favs.includes(s.id)?'★':'☆';
  renderList();
  updateMediaSession(s);
}

function updateUI(){
  $('pPlay').textContent = playing ? '❚❚' : '▶';
  if(playing) $('pStatus').textContent = t('live');
}

audio.addEventListener('playing', ()=>{
  playing = true; retryN = 0; clearRetry(); clearWait(); switching = false;
  if(segStart==null){ segStart = Date.now(); segBps = ((current && current.bitrate) || 128) * 125 }
  updateUI();
});
audio.addEventListener('pause', ()=>{
  flushData(true); clearWait();
  playing = false;
  if(!fadeIV && !retryTO && !switching) $('pStatus').textContent = t('stopped');
  updateUI();
});
audio.addEventListener('waiting', ()=>{
  if(!current) return;
  $('pStatus').textContent = t('connecting');
  clearWait();
  // තත්පර 15ක් ගිහින් ඉතිරි වුණොත් (data නැතුව හිරවුණොත්) ආයෙත් සම්බන්ධ වෙනවා
  waitTO = setTimeout(()=>{
    waitTO = null;
    if(current && !userPaused && !audio.paused && audio.readyState < 3){
      flushData(true); playing = false; updateUI();
      scheduleRetry();
    }
  }, 15000);
});
audio.addEventListener('error', ()=>{
  if(!current || !audio.getAttribute('src')) return;
  flushData(true);
  playing = false; updateUI();
  if(isMixed(current.url)){
    $('pStatus').textContent = t('errorSt');
    toast(t('httpFail'));
    return;
  }
  if(retryN===0) toast(t('noSignal'));
  scheduleRetry();
});
audio.addEventListener('ended', ()=>{
  if(!current || userPaused) return;
  flushData(true); playing = false; updateUI();
  scheduleRetry();
});

window.addEventListener('online', ()=>{
  if(current && !userPaused && !playing && !isMixed(current.url)){
    clearRetry(); retryN = 0;
    $('pStatus').textContent = t('connecting');
    audio.src = current.url; audio.load();
    audio.play().catch(onPlayReject);
  }
});
window.addEventListener('offline', ()=>{ if(current && playing) toast(t('offlineToast')) });
document.addEventListener('visibilitychange', ()=>flushData(false));

function updateMediaSession(s){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name, artist: 'SL Radio', album: s.freq? s.freq+' FM' : 'Live',
      artwork: [
        {src:'icon-192.png', sizes:'192x192', type:'image/png'},
        {src:'icon-512.png', sizes:'512x512', type:'image/png'}
      ]
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ userPaused=false; audio.play().catch(onPlayReject) });
    navigator.mediaSession.setActionHandler('pause', ()=>{ userPaused=true; clearRetry(); audio.pause() });
    navigator.mediaSession.setActionHandler('stop', ()=>stopAll());
  }catch(e){}
}

function stopAll(){
  flushData(true);
  clearRetry(); clearWait(); retryN = 0; userPaused = true;
  if(fadeIV){clearInterval(fadeIV);fadeIV=null}
  audio.pause();
  current=null;playing=false;
  audio.removeAttribute('src'); audio.load();
  audio.volume = baseVolume;
  $('player').classList.remove('show');
  renderList();
}

function resetSleepUI(){$('timerBtn').textContent='⏰ Sleep: Off';$('timerBtn').classList.remove('active')}

function setSleep(min){
  if(sleepTO){clearTimeout(sleepTO);sleepTO=null}
  if(fadeIV){clearInterval(fadeIV);fadeIV=null}
  audio.volume = baseVolume;
  sleepMin = min;
  if(min===0){resetSleepUI();return}
  $('timerBtn').textContent = `⏰ Sleep: ${min}m`;
  $('timerBtn').classList.add('active');
  sleepTO = setTimeout(()=>{
    sleepTO = null;
    const startVol = audio.volume, t0 = Date.now();
    fadeIV = setInterval(()=>{
      const p = (Date.now()-t0)/30000;
      const v = startVol*(1-p);
      if(v<=0){
        clearInterval(fadeIV);fadeIV=null;
        userPaused = true; clearRetry();
        audio.pause();audio.volume=baseVolume;
        sleepMin = 0; resetSleepUI();
        toast(t('sleepDone'));
      } else { audio.volume = v; }
    }, 200);
  }, min*60*1000);
}

const SLEEP_STEPS = [0,15,30,45,60,90];
$('timerBtn').onclick = ()=>{
  const i = SLEEP_STEPS.indexOf(sleepMin);
  setSleep(SLEEP_STEPS[(i+1)%SLEEP_STEPS.length]);
};

$('pPlay').onclick = ()=>{
  if(!current) return;
  if(playing){
    userPaused = true; clearRetry(); clearWait();
    audio.pause();
  } else {
    userPaused = false; retryN = 0; clearRetry();
    if(!audio.getAttribute('src') || audio.error){ audio.src = current.url; audio.load() }
    $('pStatus').textContent = t('connecting');
    audio.play().catch(onPlayReject);
  }
};
$('pClose').onclick = stopAll;
$('pStar').onclick = ()=>{ if(current) toggleFav(current.id) };

$('vol').oninput = e=>{baseVolume = e.target.value/100; if(!fadeIV) audio.volume = baseVolume};
$('search').oninput = e=>{query = e.target.value.trim(); renderList()};

// ===== Add / Edit modal =====
function openAdd(){
  editingId=null;$('modalTitle').textContent=t('addTitle');
  $('fName').value='';$('fFreq').value='';$('fUrl').value='';$('fEmoji').value='';$('fBitrate').value='';$('fGenre').value='Sinhala';
  $('deleteBtn').style.display='none';$('modal').classList.add('show');
}
function openEdit(id){
  const s=stations.find(x=>x.id===id);if(!s)return;
  editingId=id;$('modalTitle').textContent=t('editTitle');
  $('fName').value=s.name;$('fFreq').value=s.freq||'';$('fUrl').value=s.url;$('fEmoji').value=s.emoji||'';
  $('fBitrate').value=s.bitrate||'';$('fGenre').value=s.genre||'Sinhala';
  $('deleteBtn').style.display='block';$('modal').classList.add('show');
}
$('fab').onclick = openAdd;
$('cancelBtn').onclick = ()=>$('modal').classList.remove('show');
$('modal').onclick = e=>{ if(e.target===$('modal')) $('modal').classList.remove('show') };
$('saveBtn').onclick = ()=>{
  const name = $('fName').value.trim();
  const url = $('fUrl').value.trim();
  if(!name || !url){toast(t('need'));return}
  if(!/^https?:\/\//i.test(url)){toast(t('badUrl'));return}
  const obj = {name, url, freq:$('fFreq').value.trim(), emoji:$('fEmoji').value.trim()||'📻', genre:$('fGenre').value, bitrate:parseInt($('fBitrate').value)||0};
  if(editingId){
    const i = stations.findIndex(x=>x.id===editingId);
    stations[i] = {...stations[i], ...obj};
    if(current && current.id===editingId){
      const urlChanged = current.url !== stations[i].url;
      current = stations[i];
      $('pName').textContent=current.name;$('pIcon').textContent=current.emoji;
      if(urlChanged) playStation(current);
    }
  } else {
    obj.id = 'u_'+Date.now(); stations.push(obj);
  }
  save(K_ST, stations); $('modal').classList.remove('show'); renderList(); toast(t('saved'));
};
$('deleteBtn').onclick = ()=>{
  if(!editingId) return;
  stations = stations.filter(x=>x.id!==editingId);
  favs = favs.filter(x=>x!==editingId);
  save(K_ST, stations); save(K_FAV, favs);
  if(current && current.id===editingId) stopAll();
  $('modal').classList.remove('show'); renderList(); toast(t('removed'));
};

// ===== Online search (Radio Browser) =====
const CACHE_TTL = 6*3600*1000;
const API_HOSTS = ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info'];
let onlineResults = [], shown = [];

function guessGenre(l){
  l = (l||'').toLowerCase();
  if(l.includes('sinhal')) return 'Sinhala';
  if(l.includes('tamil')) return 'Tamil';
  if(l.includes('english')) return 'English';
  return 'Mixed';
}

async function fetchStations(q){
  const key = 'q:'+q.toLowerCase();
  const cache = load(K_CACHE, {});
  const hit = cache[key];
  if(hit && Date.now()-hit.t < CACHE_TTL) return {list:hit.d, cached:true};
  const params = 'countrycode=LK&hidebroken=true&is_https=true&order=clickcount&reverse=true&limit=100' + (q?'&name='+encodeURIComponent(q):'');
  let lastErr;
  for(const h of API_HOSTS){
    try{
      const ctl = new AbortController();
      const to = setTimeout(()=>ctl.abort(), 8000);
      const r = await fetch(h+'/json/stations/search?'+params, {signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const raw = await r.json();
      const seen = new Set();
      const out = raw.map(s=>({
        name:(s.name||'').trim(), url:s.url_resolved||s.url,
        bitrate:parseInt(s.bitrate)||0, codec:s.codec||'', lang:s.language||''
      })).filter(s=>s.name && /^https:\/\//i.test(s.url) && !seen.has(s.url) && seen.add(s.url));
      cache[key] = {t:Date.now(), d:out};
      const keys = Object.keys(cache);
      if(keys.length>10) delete cache[keys[0]];
      save(K_CACHE, cache);
      return {list:out, cached:false};
    }catch(e){ lastErr = e }
  }
  throw lastErr || new Error('fail');
}

function renderOnline(){
  const low = $('oLow').checked;
  let list = onlineResults.slice();
  if(low) list = list.filter(s=>s.bitrate>0 && s.bitrate<=64).sort((a,b)=>a.bitrate-b.bitrate);
  shown = list;
  const box = $('oList');
  if(!list.length){
    box.innerHTML = `<div class="empty">${(low && onlineResults.length) ? t('noLow') : t('noResults')}</div>`;
    return;
  }
  box.innerHTML = list.map((s,i)=>{
    const added = stations.some(x=>x.url===s.url);
    const playingNow = current && current.url===s.url;
    const br = s.bitrate ? `${s.bitrate} kbps · ≈${Math.max(1,Math.round(s.bitrate*0.45))} ${t('perHour')}` : t('unknownBr');
    return `<div class="orow ${playingNow?'playing':''}">
      <div class="info"><div class="name">${esc(s.name)}</div><div class="meta">${br}${s.codec?' · '+esc(s.codec):''}</div></div>
      <button class="obtn" data-p="${i}">${playingNow&&playing?'❚❚':'▶'}</button>
      <button class="obtn add ${added?'done':''}" data-a="${i}">${added?'✓':'＋'}</button>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>previewOnline(shown[+b.dataset.p]));
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>addOnline(shown[+b.dataset.a]));
}

function previewOnline(s){
  if(!s) return;
  if(current && current.url===s.url && playing){ userPaused = true; clearRetry(); audio.pause(); return }
  playStation({id:'tmp_preview', name:s.name, url:s.url, emoji:'📻', genre:guessGenre(s.lang), freq:'', bitrate:s.bitrate});
  renderOnline();
}

function addOnline(s){
  if(!s) return;
  if(stations.some(x=>x.url===s.url)){toast(t('already'));return}
  const st = {id:'u_'+Date.now(), name:s.name, url:s.url, freq:'', emoji:'📻', genre:guessGenre(s.lang), bitrate:s.bitrate};
  stations.push(st); save(K_ST, stations);
  if(current && current.url===st.url){ current = st; $('pStar').textContent = favs.includes(st.id)?'★':'☆' }
  renderList(); renderOnline(); toast(t('added'));
}

async function doSearch(){
  const q = $('oQuery').value.trim();
  $('oList').innerHTML = `<div class="empty">${t('searching')}</div>`;
  try{
    const {list, cached} = await fetchStations(q);
    onlineResults = list; renderOnline();
    if(cached) toast(t('cachedToast'));
  }catch(e){
    $('oList').innerHTML = `<div class="empty">${t('netFail')}</div>`;
  }
}

$('onlineBtn').onclick = ()=>{ $('omodal').classList.add('show'); if(!onlineResults.length) doSearch() };
$('oClose').onclick = ()=>$('omodal').classList.remove('show');
$('omodal').onclick = e=>{ if(e.target===$('omodal')) $('omodal').classList.remove('show') };
$('oGo').onclick = doSearch;
$('oQuery').onkeydown = e=>{ if(e.key==='Enter') doSearch() };
$('oLow').checked = load(K_LOW, false);
$('oLow').onchange = ()=>{ save(K_LOW, $('oLow').checked); renderOnline() };
['playing','pause'].forEach(ev=>audio.addEventListener(ev, ()=>{ if($('omodal').classList.contains('show') && onlineResults.length) renderOnline() }));

// ===== Data modal =====
$('dataBtn').onclick = ()=>{ flushData(false); renderData(); $('dmodal').classList.add('show') };
$('dClose').onclick = ()=>$('dmodal').classList.remove('show');
$('dmodal').onclick = e=>{ if(e.target===$('dmodal')) $('dmodal').classList.remove('show') };
$('dReset').onclick = ()=>{
  if(!confirm(t('dConfirm'))) return;
  save(K_DATA, {}); renderData(); toast(t('dResetOk'));
};
setInterval(()=>{
  if(playing) flushData(false);
  if($('dmodal').classList.contains('show')){ flushData(false); renderData() }
}, 10000);

// ===== Sri Lanka clock (ෆෝන් එකේ timezone එක මොකක් වුණත් ලංකා වේලාව) =====
let clockLast = '';
const SI_MONTHS = ['ජන','පෙබ','මාර්','අප්‍රි','මැයි','ජූනි','ජූලි','අගෝ','සැප්','ඔක්','නොවැ','දෙසැ'];
function tickClock(){
  const el = $('clock'); if(!el) return;
  const d = new Date();
  let tm, dt;
  try{
    tm = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Colombo',hour:'numeric',minute:'2-digit',hour12:true}).format(d);
    if(lang==='si'){
      const p = {};
      new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Colombo',day:'numeric',month:'numeric'}).formatToParts(d).forEach(x=>{p[x.type]=x.value});
      const wd = new Intl.DateTimeFormat('si-LK',{timeZone:'Asia/Colombo',weekday:'long'}).format(d);
      dt = SI_MONTHS[(+p.month||1)-1]+' '+p.day+' '+wd;
    } else {
      dt = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',weekday:'short',day:'numeric',month:'short'}).format(d);
    }
  }catch(e){
    // Intl timezone support නැති පරණ browser: UTC+5:30 අතින් ගණනය
    const x = new Date(d.getTime() + 330*60000);
    let h = x.getUTCHours(); const m = String(x.getUTCMinutes()).padStart(2,'0');
    const ap = h>=12?'PM':'AM'; h = h%12 || 12;
    tm = h+':'+m+' '+ap; dt = '';
  }
  const html = '🇱🇰 <b>'+esc(tm)+'</b>'+(dt?' · '+esc(dt):'');
  if(html!==clockLast){ clockLast = html; el.innerHTML = html }
}
setInterval(tickClock, 1000);
document.addEventListener('visibilitychange', tickClock);

// ===== Language switch =====
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')) });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')) });
  $('langBtn').textContent = lang==='si' ? 'EN' : 'සි';
  $('modalTitle').textContent = t(editingId ? 'editTitle' : 'addTitle');
  if(!current) $('pStatus').textContent = t('stopped');
  else if(playing) $('pStatus').textContent = t('live');
  else if(!retryTO && audio.paused) $('pStatus').textContent = t('stopped');
  renderTabs(); renderList(); tickClock();
  if(onlineResults.length) renderOnline();
  if($('dmodal').classList.contains('show')) renderData();
}
$('langBtn').onclick = ()=>{
  lang = (lang==='si') ? 'en' : 'si';
  save(K_LANG, lang);
  applyLang();
};

// Init
applyLang();

// PWA service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
